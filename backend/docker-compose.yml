# Optional: `docker compose up -d db` gives you the PostgreSQL the .env.example expects.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: acbridge
      POSTGRES_PASSWORD: acbridge
      POSTGRES_DB: acbridge
    ports: ["5432:5432"]
    volumes: ["acbridge_pgdata:/var/lib/postgresql/data"]
volumes:
  acbridge_pgdata:
